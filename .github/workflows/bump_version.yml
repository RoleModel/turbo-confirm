name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump-type:
        description: SemVer Bump Type
        required: false
        default: minor
        type: choice
        options:
          - patch
          - minor
          - major
      changelog-description:
        description: Changelog entry (separate bullets with $>)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RMS_VERSION_MANAGER_CLIENT_ID }}
          private-key: ${{ secrets.RMS_VERSION_MANAGER_CERT }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git identity
        run: |
          git config user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

      - name: Bump version
        env:
          BUMP_TYPE: ${{ inputs.bump-type }}
        run: echo "TAG=$(npm version "$BUMP_TYPE" --no-git-tag-version)" >> "$GITHUB_ENV"

      - name: Add changelog entry
        env:
          CHANGELOG_DESCRIPTION: ${{ inputs.changelog-description }}
        shell: ruby {0}
        run: |
          tag = ENV.fetch("TAG")
          bullets = ENV.fetch("CHANGELOG_DESCRIPTION").split(/\$>|\n/).map(&:strip).reject(&:empty?).map { "- #{_1}" }
          entry = "## [#{tag}] #{Time.now.utc.strftime("%b %-d, %Y")}\n\n#{bullets.join("\n")}\n\n"
          link = "[#{tag}]: #{ENV.fetch("GITHUB_SERVER_URL")}/#{ENV.fetch("GITHUB_REPOSITORY")}/releases/tag/#{tag}\n"

          changelog = File.read("CHANGELOG.md")
          changelog.sub!(/^## /) { entry + _1 }
          changelog.sub!(/^\[v/) { link + _1 }
          File.write("CHANGELOG.md", changelog)

      - name: Commit and tag
        run: |
          git commit -am "$TAG"
          git tag -m "$TAG" "$TAG"

      - name: Push
        run: git push --atomic origin "HEAD:${GITHUB_REF_NAME}" --follow-tags
