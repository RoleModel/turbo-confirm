name: Release

on:
  workflow_dispatch:
    inputs:
      bump-type:
        type: choice
        options: [patch, minor, major]
        default: minor
      changelog:
        description: Changelog bullets (separate with $>). Leave blank to use the Unreleased notes or draft them from the commits.
        type: string
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'bump' || github.ref }}

jobs:
  release:
    uses: RoleModel/actions/.github/workflows/release.yml@v3
    with:
      bump-type: ${{ inputs.bump-type }}
      changelog: ${{ inputs.changelog }}
      publish-npm: true
    secrets: inherit

  publish-gph:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          registry-url: https://npm.pkg.github.com/
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
